<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link href="riva.css" rel="stylesheet" />
</head>
<body>
    <h1>RIVAAA SLAIYYY</h1>
    
    <div class="container" id="card-list"></div>
    <div class="saldo" id="saldo"></div>
    <script>
        
        const products = [
            {
                nama: "daiyor",
                harga: 24000000,
                gambar: "c.jpg"
            },
            {
                nama: "ferfyum",
                harga: 36000000,
                gambar: "o.jpg"
            },
            {
                nama: "waiyesel",
                harga: 1200000,
                gambar: "u.jpg"
            },
            {
                nama: "blush daiyor",
                harga: 3400000,
                gambar: "m.jpg"
            },
            {
                nama: "speisials",
                harga: 240000000,
                gambar: "j.jpg"
            },
            {
                nama: "tyas",
                harga: 12000000,
                gambar: "d.jpg"
            },
            {
                nama: "rholexqkxq",
                harga: 70000000,
                gambar: "x.jpg"
            },
            {
                nama: "sylyop",
                harga: 100000000,
                gambar: "k.jpg"
            },
            {
                nama: "nasyi telyur",
                harga: 450000,
                gambar: "r.jpg"
            },
            {
                nama: "bwaksyo",
                harga: 360000,
                gambar: "i.jpg"
            },
            {
                nama: "vemveq",
                harga: 120000,
                gambar: "v.jpg"
            },
            {
                nama: "dimsyum",
                harga: 390000,
                gambar: "a.jpg"
            },
            {
                nama: "syoklats",
                harga: 200000,
                gambar: "w.jpg"
            },
            {
                nama: "matsya",
                harga: 999000,
                gambar: "g.jpg"
            },
            {
                nama: "jyerux",
                harga: 760000,
                gambar: "h.jpg"
            },
            {
                nama: "dyuriyan",
                harga: 6400000,
                gambar: "di.jpg"
            },
        ];

        let saldo = 450000000;
       
        function formatRupiah(amount) {
            return new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(amount);
        }

        
        document.getElementById("saldo").textContent =
            `Saldo: ${formatRupiah(saldo)}`;
        const card = document.getElementById("card-list");
        card.innerHTML = products
            .map((item, index) => {
                return `
                    <div class="card">
                        <img src="${item.gambar}" alt="${item.nama}" 
                        <div class="card-body">
                            <h2>${item.nama}</h2>
                            <h3 style="color:red">
                                ${formatRupiah(item.harga)}
                            </h3>
                            <button 
                                class="btn btn-primary"
                                data-index="${index}">
                                beli
                            </button>
                        </div>
                    </div>
                `;
            })
            .join("");

        const beli = document.querySelectorAll(".btn-primary");

        beli.forEach((button) => {
            button.addEventListener("click", () => {
                const index = button.getAttribute("data-index");
                const harga = products[index].harga;
                if (saldo >= harga) {
                    saldo -= harga;
                    document.getElementById("saldo").textContent =
                        `Saldo: ${formatRupiah(saldo)}`;
                    alert(
                        `Anda membeli ${products[index].nama} seharga ${formatRupiah(harga)}.
                         Sisa saldo: ${formatRupiah(saldo)}`
                    );
                } else {
                    alert("Saldo tidak mencukupi");
                }
            });
        });
    </script>

</body>
</html>
